
<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Transasia Valuation</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #F7F5F5;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    .container { padding: 30px; }
    .logo {
      width: 160px;
      height: 160px;
      border-radius: 30px;
    }
    h2 { color: #80004B; }
    #googleSignIn {
      display: flex;
      justify-content: center;
      margin-top: 25px;
    }
    #message {
      color: #555;
      font-size: 13px;
      margin-top: 18px;
    }
  </style>
</head>
<body>
  <div class="container">
    <img class="logo"
      src="./transasia-icon-512.png"
      alt="Transasia Logo">

    <h2>TRANSASIA VALUATION STATUS</h2>

    <div id="googleSignIn"></div>
    <div id="message">Please sign in with Google</div>
  </div>

  <script>
    const CLIENT_ID =
      "987368239981-1vermuon1m476s75233kl1cn4uoheulj.apps.googleusercontent.com";

    const APP_URL =
      "https://script.google.com/macros/s/AKfycbzG9f7y3zezT4nezNxCxk7Q7XtUz6Cps6c7B17H1L2AC8AoeXD092LaTOoyN486G4YG/exec";

    function handleGoogleLogin(response) {
      document.getElementById("message").textContent =
        "Opening Transasia Valuation...";

      window.location.replace(
        APP_URL + "#id_token=" +
        encodeURIComponent(response.credential)
      );
    }

    window.onload = function() {
      google.accounts.id.initialize({
        client_id: CLIENT_ID,
        callback: handleGoogleLogin
      });

      google.accounts.id.renderButton(
        document.getElementById("googleSignIn"),
        {
          theme: "outline",
          size: "large",
          text: "signin_with",
          shape: "rectangular",
          width: 250
        }
      );
    };
  </script>
</body>
</html>
